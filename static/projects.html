<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:,">
<title>Projects — KNDB</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">KNDB<span class="brand-sub">knowledge database</span></div>
  <nav class="top-nav">
    <a href="/" class="tab">Sources</a>
    <a href="/projects" class="tab active">Projects</a>
  </nav>
  <div class="top-actions">
    <button id="btn-new" class="btn primary">+ New project</button>
  </div>
</header>

<main class="main page">
  <div class="page-head">
    <h1>Projects</h1>
    <p class="muted">Reading groups, papers in progress and shared workspaces.
      Each project opens its own workspace with a library, notes and a LaTeX editor.</p>
    <input id="prj-search" class="search wide" type="search" spellcheck="false"
           placeholder="Filter projects by name or description…">
  </div>

  <div id="prj-list" class="prj-list grid"></div>
</main>

<div class="modal hidden" id="modal-new">
  <div class="modal-box">
    <div class="modal-head"><h3>New project</h3><button class="x" data-close="modal-new">×</button></div>
    <div class="modal-body">
      <label class="lbl">Name</label>
      <input id="new-name" class="input" type="text" spellcheck="false" placeholder="e.g. Reading group: RL">
      <label class="lbl">Description (optional)</label>
      <textarea id="new-desc" class="input" rows="3" spellcheck="false"></textarea>
      <div class="modal-actions">
        <button id="new-submit" class="btn primary">Create</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/projects.js"></script>
</body>
</html>
